<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Federated Health Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1420;
  --panel:#161f30;
  --panel-2:#1e2a3f;
  --line:#2a3852;
  --text:#e9edf3;
  --muted:#8fa0ba;
  --accent:#5b8def;
  --sage:#6fbf9a;
  --danger:#e0715a;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:'Inter',sans-serif;
  line-height:1.5;
}
.wrap{
  max-width:960px;
  margin:0 auto;
  padding:48px 24px 100px;
}
.hero h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:clamp(28px,4vw,40px);
  margin:0 0 10px;
}
.hero p{
  color:var(--muted);
  margin:0 0 32px;
  max-width:560px;
  font-size:15px;
}
.tabs{
  display:flex;
  gap:8px;
  margin-bottom:28px;
  border-bottom:1px solid var(--line);
}
.tab{
  padding:12px 18px;
  font-size:14px;
  font-weight:500;
  color:var(--muted);
  cursor:pointer;
  border-bottom:2px solid transparent;
}
.tab.active{
  color:var(--text);
  border-color:var(--accent);
}
.panel{display:none;}
.panel.active{display:block;}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:28px;
}
.section-title{
  font-size:13px;
  text-transform:none;
  color:var(--muted);
  margin:0 0 14px;
  padding-top:8px;
}
.section-title:first-child{padding-top:0;}
.field-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:8px;
}
@media (max-width:640px){.field-grid{grid-template-columns:1fr;}}
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.field.full{grid-column:1/-1;}
label{
  font-size:13px;
  color:var(--muted);
}
input,select,textarea{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  color:var(--text);
  font-size:14px;
  font-family:inherit;
}
input:focus,select:focus,textarea:focus{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
textarea{resize:vertical;min-height:60px;}
.hint{font-size:12px;color:var(--muted);margin-top:2px;}
.symptomGrid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-top:6px;
}
@media (max-width:640px){.symptomGrid{grid-template-columns:1fr 1fr;}}
.symptom{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border-radius:8px;
  font-size:13.5px;
  cursor:pointer;
  border:1px solid transparent;
}
.symptom:hover{background:var(--panel-2);}
.symptom.selected{background:rgba(91,141,239,0.14);border-color:var(--accent);}
.symptom input{accent-color:var(--accent);width:auto;padding:0;}
.actions{display:flex;gap:12px;margin-top:24px;}
button{
  border:none;
  border-radius:8px;
  padding:12px 22px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
}
.primary{background:var(--accent);color:#fff;flex:1;}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.status{
  margin-top:16px;
  padding:10px 14px;
  border-radius:8px;
  font-size:13.5px;
}
.status.ok{background:rgba(111,191,154,0.12);border:1px solid var(--sage);color:var(--sage);}
.status.err{background:rgba(224,113,90,0.12);border:1px solid var(--danger);color:var(--danger);}
.resultTop{
  text-align:center;
  padding:16px 10px 22px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}
.resultTop .label{color:var(--muted);font-size:13px;margin-bottom:6px;}
.resultTop .disease{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--sage);}
.confBar{height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-top:12px;}
.confBar div{height:100%;background:var(--sage);}
.rankRow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.rankRow:last-child{border-bottom:none;}
.rankRow .pct{color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Federated health intake</h1>
    <p>Patient details are stored separately from the model. Only the model weights ever travel between hospitals; nothing here does.</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="intake">Patient intake</div>
    <div class="tab" data-tab="predict">Predict condition</div>
  </div>

  <div class="panel active" id="panel-intake">
    <div class="card">
      <form id="intakeForm">
        <div class="section-title">Identity</div>
        <div class="field-grid">
          <div class="field"><label>Full name</label><input type="text" id="name" required></div>
          <div class="field">
            <label>Birthdate</label>
            <input type="text" id="birthdate" placeholder="DD-MM-YYYY">
            <div class="hint">Type it any way you like, e.g. 14-03-1990</div>
          </div>
          <div class="field"><label>Age</label><input type="number" id="age" min="0" max="120"></div>
          <div class="field">
            <label>Gender</label>
            <select id="gender">
              <option>Female</option>
              <option>Male</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field"><label>Weight (kg)</label><input type="number" step="0.1" id="weight_kg"></div>
          <div class="field"><label>Height (cm)</label><input type="number" step="0.1" id="height_cm"></div>
          <div class="field"><label>Phone number</label><input type="text" id="phone_number"></div>
          <div class="field full"><label>Address</label><input type="text" id="address"></div>
        </div>

        <div class="section-title">Emergency contact</div>
        <div class="field-grid">
          <div class="field"><label>Name</label><input type="text" id="emergency_contact_name"></div>
          <div class="field"><label>Relation</label><input type="text" id="emergency_contact_relation"></div>
          <div class="field full"><label>Phone number</label><input type="text" id="emergency_contact_phone"></div>
        </div>

        <div class="section-title">Clinical background</div>
        <div class="symptomGrid" id="intakeSymptoms"></div>
        <div class="field-grid" style="margin-top:16px;">
          <div class="field full"><label>Past illnesses / surgeries</label><textarea id="past_conditions"></textarea></div>
          <div class="field full"><label>Family health history</label><textarea id="family_history"></textarea></div>
          <div class="field full"><label>Confirmed diagnosis (optional, used to retrain the model)</label><input type="text" id="diagnosis"></div>
        </div>

        <div class="actions">
          <button type="submit" class="primary">Save patient record</button>
          <button type="button" class="ghost" id="intakeReset">Clear</button>
        </div>
        <div id="intakeStatus"></div>
      </form>
    </div>
  </div>

  <div class="panel" id="panel-predict">
    <div class="card">
      <div class="section-title">Select symptoms</div>
      <div class="symptomGrid" id="predictSymptoms"></div>
      <div class="actions">
        <button id="predictBtn" class="primary" disabled>Predict condition</button>
        <button id="predictReset" class="ghost">Clear</button>
      </div>
      <div id="resultPanel" style="margin-top:20px;"></div>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://localhost:5000";
let symptomVocab = [];
let selectedIntake = new Set();
let selectedPredict = new Set();

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(`panel-${tab.dataset.tab}`).classList.add("active");
  });
});

function formatName(name){
  return name.replace(/_/g, " ");
}

function renderSymptomGrid(containerId, selectedSet){
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  symptomVocab.forEach(name => {
    const row = document.createElement("label");
    row.className = "symptom";
    row.innerHTML = `<input type="checkbox"><span>${formatName(name)}</span>`;
    row.querySelector("input").addEventListener("change", (e) => {
      if(e.target.checked){ selectedSet.add(name); row.classList.add("selected"); }
      else { selectedSet.delete(name); row.classList.remove("selected"); }
      if(containerId === "predictSymptoms"){
        document.getElementById("predictBtn").disabled = selectedPredict.size === 0;
      }
    });
    container.appendChild(row);
  });
}

async function loadSymptoms(){
  const res = await fetch(`${API_BASE}/symptoms`);
  const data = await res.json();
  symptomVocab = data.symptoms;
  renderSymptomGrid("intakeSymptoms", selectedIntake);
  renderSymptomGrid("predictSymptoms", selectedPredict);
}

document.getElementById("intakeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const statusEl = document.getElementById("intakeStatus");
  statusEl.innerHTML = "";
  const payload = {
    name: document.getElementById("name").value,
    birthdate: document.getElementById("birthdate").value,
    age: document.getElementById("age").value || null,
    gender: document.getElementById("gender").value,
    weight_kg: document.getElementById("weight_kg").value || null,
    height_cm: document.getElementById("height_cm").value || null,
    phone_number: document.getElementById("phone_number").value,
    address: document.getElementById("address").value,
    emergency_contact_name: document.getElementById("emergency_contact_name").value,
    emergency_contact_relation: document.getElementById("emergency_contact_relation").value,
    emergency_contact_phone: document.getElementById("emergency_contact_phone").value,
    symptoms: Array.from(selectedIntake),
    past_conditions: document.getElementById("past_conditions").value,
    family_history: document.getElementById("family_history").value,
    diagnosis: document.getElementById("diagnosis").value,
  };
  try{
    const res = await fetch(`${API_BASE}/register`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error("failed");
    const data = await res.json();
    statusEl.innerHTML = `<div class="status ok">Saved. Patient ID ${data.patient_id}</div>`;
  } catch(err){
    statusEl.innerHTML = `<div class="status err">Could not reach the server. Make sure app.py is running.</div>`;
  }
});

document.getElementById("intakeReset").addEventListener("click", () => {
  document.getElementById("intakeForm").reset();
  selectedIntake.clear();
  renderSymptomGrid("intakeSymptoms", selectedIntake);
  document.getElementById("intakeStatus").innerHTML = "";
});

document.getElementById("predictReset").addEventListener("click", () => {
  selectedPredict.clear();
  renderSymptomGrid("predictSymptoms", selectedPredict);
  document.getElementById("predictBtn").disabled = true;
  document.getElementById("resultPanel").innerHTML = "";
});

document.getElementById("predictBtn").addEventListener("click", async () => {
  const btn = document.getElementById("predictBtn");
  btn.disabled = true;
  btn.innerText = "Predicting...";
  try{
    const res = await fetch(`${API_BASE}/predict`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        symptoms: Array.from(selectedPredict),
        gender: "Other",
        age: 0,
        weight_kg: 0,
        height_cm: 0
      })
    });
    if(!res.ok) throw new Error("failed");
    const data = await res.json();
    renderResult(data);
  } catch(err){
    document.getElementById("resultPanel").innerHTML = `<div class="status err">Could not reach the prediction server.</div>`;
  } finally {
    btn.disabled = false;
    btn.innerText = "Predict condition";
  }
});

function renderResult(data){
  const pct = Math.round(data.confidence * 100);
  const rows = data.top_k.slice(1).map(item => {
    const p = Math.round(item.confidence * 100);
    return `<div class="rankRow"><span>${item.disease}</span><span class="pct">${p}%</span></div>`;
  }).join("");
  document.getElementById("resultPanel").innerHTML = `
    <div class="resultTop">
      <div class="label">Most likely condition</div>
      <div class="disease">${data.prediction}</div>
      <div class="confBar"><div style="width:${pct}%"></div></div>
      <div class="label" style="margin-top:8px;">${pct}% confidence</div>
    </div>
    ${rows}
  `;
}

loadSymptoms();
</script>
</body>
</html>
